[package]
name = "host_audio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Host audio layer (output/input device I/O + their OSC control) layered above the orender engine; never a dependency of the engine or liborender"

[dependencies]
runtime_control = { path = "../runtime_control" }
audio_output = { path = "../audio_output" }
audio_input = { path = "../audio_input" }
renderer = { path = "../renderer" }
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
